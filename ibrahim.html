<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>اختبارات البرمجة التفرعية – النظري</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', 'Helvetica Neue', sans-serif;
            background: #f0f6fb;
            color: #1e2b3c;
            padding: 1rem;
            line-height: 1.7;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.9rem;
            border-right: 6px solid #1a6b8f;
            padding-right: 1rem;
            margin-bottom: 0.2rem;
            color: #0b3b4f;
        }

        .subhead {
            color: #2c5770;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #cbdae6;
            padding-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .section-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: #e3eef7;
            padding: 0.8rem;
            border-radius: 50px;
            justify-content: center;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.05);
        }

        .section-tabs button {
            background: transparent;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #1f4057;
            cursor: pointer;
            transition: 0.25s;
            background: #ffffffc0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            flex: 1 0 auto;
            max-width: 220px;
            white-space: nowrap;
        }

        .section-tabs button:hover {
            background: #c7dcec;
            transform: scale(0.97);
        }

        .section-tabs button.active {
            background: #1a5e7e;
            color: white;
            box-shadow: 0 4px 14px rgba(22, 78, 109, 0.3);
        }

        .section-tabs button.lecture-tab {
            border: 2px solid #e6a817;
            background: #fff8e7;
        }

        .section-tabs button.lecture-tab.active {
            background: #d4891b;
            border-color: #b87314;
            color: white;
        }

        .section-tabs button.review-tab {
            border: 2px solid #1f7a5a;
            background: #e8f5f0;
        }

        .section-tabs button.review-tab.active {
            background: #1f7a5a;
            border-color: #136348;
            color: white;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1.5rem;
            background: white;
            padding: 1rem 1.8rem;
            border-radius: 40px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            justify-content: center;
            align-items: center;
            border: 1px solid #e3edf5;
        }

        .stats span {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .stats .num {
            background: #dce8f2;
            padding: 0.1rem 0.9rem;
            border-radius: 30px;
            font-weight: 700;
            color: #10415c;
        }

        .test-btn {
            background: #1f7a5a;
            color: white;
            border: none;
            padding: 0.5rem 2rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(26, 107, 74, 0.25);
            margin-right: auto;
        }

        .test-btn:hover {
            background: #136348;
            transform: scale(0.97);
        }

        .test-btn.active-test {
            background: #b13e3e;
            box-shadow: 0 4px 14px rgba(176, 52, 52, 0.35);
        }

        .test-btn.active-test:hover {
            background: #8f2f2f;
        }

        .test-btn.review-btn {
            background: #1a6b8f;
            box-shadow: 0 4px 12px rgba(26, 107, 143, 0.3);
        }

        .test-btn.review-btn:hover {
            background: #0f4f6b;
        }

            background: #e2f0e9;
            border-radius: 60px;
            padding: 0.3rem 1.8rem;
            font-weight: 700;
            font-size: 1.05rem;
            color: #0f5132;
            border-right: 6px solid #1f7a5a;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-grid {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .question-card {
            background: white;
            border-radius: 24px;
            padding: 1.3rem 1.6rem;
            box-shadow: 0 4px 18px rgba(0, 20, 30, 0.05);
            border: 1px solid #e3edf5;
            transition: 0.15s;
        }

        .question-card:hover {
            border-color: #b6d2e9;
        }

        .question-card.review-card {
            border-right: 6px solid #1f7a5a;
            background: #fafffe;
        }

        .question-card.review-card .q-text {
            color: #0b3b4f;
            font-weight: 600;
        }

        .question-card.review-card .answer-box {
            background: #e8f5f0;
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            margin-top: 0.5rem;
            border-right: 4px solid #1f7a5a;
        }

        .question-card.review-card .answer-box strong {
            color: #0f5132;
        }

        .q-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
            gap: 0.3rem;
        }

        .q-type {
            background: #d4e2ed;
            padding: 0.15rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            color: #1b4055;
        }

        .q-type.review-type {
            background: #1f7a5a;
            color: white;
        }

        .q-topic {
            background: #f0e6c8;
            padding: 0.15rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            color: #7a631f;
        }

        .q-topic.review-topic {
            background: #d4a843;
            color: white;
        }

        .q-num {
            font-weight: 600;
            color: #1d577a;
        }

        .q-text {
            font-size: 1rem;
            margin: 0.4rem 0 0.8rem 0;
            line-height: 1.8;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 0.8rem 1.2rem;
            background: #f3f8fe;
            border-radius: 20px;
            margin-top: 0.2rem;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.3rem 0.5rem;
            border-radius: 12px;
            transition: background 0.15s;
        }

        .options label:hover {
            background: #e3eef9;
        }

        .options input[type="radio"] {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: #1a6b8f;
            cursor: pointer;
            flex-shrink: 0;
        }

        .tf-options {
            display: flex;
            gap: 2.5rem;
            background: #f3f8fe;
            padding: 0.6rem 2.5rem;
            border-radius: 60px;
            width: fit-content;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tf-options label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            transition: background 0.15s;
        }

        .tf-options label:hover {
            background: #e3eef9;
        }

        .tf-options input[type="radio"] {
            width: 1.3rem;
            height: 1.3rem;
            accent-color: #1a6b8f;
            cursor: pointer;
            flex-shrink: 0;
        }

        .explanation {
            background: #eef4fa;
            border-radius: 16px;
            padding: 0.6rem 1.2rem;
            margin-top: 0.8rem;
            color: #1d4057;
            font-size: 0.9rem;
            border-right: 4px solid #578baa;
            animation: fadeIn 0.4s ease;
        }

        .explanation strong {
            color: #05445e;
        }

        .mcq-answer {
            background: #d9e7f3;
            border-radius: 16px;
            padding: 0.1rem 0.8rem;
            font-weight: 600;
            color: #003153;
            font-size: 0.8rem;
        }

        .tf-answer {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .quiz-mode .question-card {
            border-right: 6px solid #1a6b8f;
        }

        .quiz-mode .question-card.correct {
            border-right-color: #1f7a5a;
            background: #f6fcf9;
        }

        .quiz-mode .question-card.wrong {
            border-right-color: #b13e3e;
            background: #fdf6f6;
        }

        .test-actions {
            display: flex;
            justify-content: center;
            padding: 1.5rem 0 2rem 0;
            border-top: 1px solid #cddde9;
            margin-top: 0.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .test-actions .test-btn {
            font-size: 1.1rem;
            padding: 0.8rem 2.5rem;
            margin-right: 0;
            width: 100%;
            max-width: 320px;
            text-align: center;
            border-radius: 60px;
        }

        .test-actions .test-btn.active-test {
            background: #b13e3e;
            box-shadow: 0 6px 20px rgba(176, 52, 52, 0.35);
        }

        .test-actions .test-btn.active-test:hover {
            background: #8f2f2f;
        }

        .footnote {
            margin-top: 1rem;
            padding: 0.8rem;
            text-align: center;
            color: #436f8b;
            border-top: 1px solid #cddde9;
            font-size: 0.85rem;
        }

        .badge-lecture {
            background: #e6a817;
            color: white;
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
            margin-right: 0.3rem;
        }

        .badge-review {
            background: #1f7a5a;
            color: white;
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
            margin-right: 0.3rem;
        }

        /* أيقونات المراجعة */
        .review-icon {
            font-size: 1.2rem;
            margin-left: 0.3rem;
        }

        .answer-box ul {
            padding-right: 1.5rem;
            margin: 0.3rem 0;
        }

        .answer-box ul li {
            margin-bottom: 0.2rem;
        }

        @media (max-width: 640px) {
            body { padding: 0.8rem; }
            h1 { font-size: 1.5rem; padding-right: 0.8rem; }
            .section-tabs { padding: 0.6rem; gap: 0.4rem; border-radius: 30px; }
            .section-tabs button { font-size: 0.7rem; padding: 0.4rem 0.6rem; max-width: 130px; white-space: normal; }
            .stats { padding: 0.8rem 1rem; gap: 0.6rem; border-radius: 30px; flex-direction: column; align-items: stretch; text-align: center; }
            .stats span { font-size: 0.85rem; }
            .test-btn { font-size: 0.9rem; padding: 0.4rem 1.2rem; margin-right: 0; width: 100%; text-align: center; }
            .result-banner { font-size: 0.9rem; padding: 0.2rem 1rem; text-align: center; }
            .question-card { padding: 1rem; border-radius: 18px; }
            .q-text { font-size: 0.95rem; }
            .options { padding: 0.6rem 0.8rem; gap: 0.5rem; }
            .options label { font-size: 0.88rem; padding: 0.2rem 0.4rem; }
            .tf-options { padding: 0.5rem 1.2rem; gap: 1.8rem; width: 100%; justify-content: center; }
            .tf-options label { font-size: 0.95rem; padding: 0.2rem 0.5rem; }
            .tf-options input[type="radio"] { width: 1.2rem; height: 1.2rem; }
            .test-actions .test-btn { font-size: 1rem; padding: 0.7rem 1.5rem; max-width: 100%; }
            .explanation { font-size: 0.85rem; padding: 0.4rem 1rem; }
            .answer-box { padding: 0.6rem 1rem; }
        }

        @media (max-width: 400px) {
            .section-tabs button { font-size: 0.6rem; padding: 0.3rem 0.4rem; max-width: 110px; }
            .stats { padding: 0.6rem 0.8rem; }
            .question-card { padding: 0.8rem; }
            .q-text { font-size: 0.9rem; }
            .options label { font-size: 0.82rem; }
            .tf-options { gap: 1.2rem; padding: 0.4rem 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📘 البرمجة التفرعية – النظري</h1>
    <div class="subhead">اختر النموذج المناسب — اضغط "اختبر نفسك" للإجابة ثم اعرض النتيجة</div>

</div>

        { num: 28, type: 'mcq', text: 'أي العبارات أدق بخصوص أثر أمن المعلومات في وقوع الاختراق؟', options: { A: 'يمنع الاختراق كلياً', B: 'لا يمنع الاختراق إطلاقاً', C: 'ليس له أي أثر', D: 'العبارات الثلاث السابقة غير دقيقة' }, answer: 'D' },
        { num: 29, type: 'mcq', text: 'للتحقق من هوية المستخدم يمكن استخدام:', options: { A: 'تصنيف البيانات إلى سرية وغير سرية', B: 'تحديد مستويات الوصول فقط', C: 'أرقام أو معلومات يعرفها المستخدم مسبقاً', D: 'جميع ما سبق' }, answer: 'C' },
        { num: 30, type: 'mcq', text: 'الإشراف على أمن الحواسيب وإعداد معايير وإجراءات السلامة في مركز المعلومات من مهام:', options: { A: 'محلل ومبرمج النظم', B: 'مدير مركز المعلومات', C: 'مدخل البيانات', D: 'المستخدم النهائي' }, answer: 'B' },
        { num: 31, type: 'mcq', text: 'أكثر أفراد الكادر الوظيفي تهديداً لمركز المعلومات بحسب مقرر الدورة هو:', options: { A: 'المستخدم النهائي', B: 'محلل النظم', C: 'مدير المركز', D: 'مدخل البيانات' }, answer: 'A' },
        { num: 32, type: 'mcq', text: 'من أكثر قنوات الهندسة الاجتماعية شيوعاً بين المهاجمين:', options: { A: 'الهاتف', B: 'الإنترنت', C: 'النفايات', D: 'انتحال الشخصية' }, answer: 'C' },
        { num: 33, type: 'mcq', text: 'أضعف حلقة في منظومة حماية المعلومات غالباً هي:', options: { A: 'خطوط الاتصال', B: 'الطابعات والطرفيات', C: 'العنصر البشري', D: 'برامج مكافحة الفيروسات' }, answer: 'C' },
        { num: 34, type: 'mcq', text: 'إذا كان P النص الواضح و C النص المشفر و E خوارزمية التشفير بالمفتاح K، فالعلاقة الصحيحة هي:', options: { A: 'P = D_K(C)', B: 'C = E_K(P)', C: 'K = C.P', D: 'D_K(E_K(P)) فقط' }, answer: 'B' },
        { num: 35, type: 'mcq', text: 'عندما يملك المهاجم نصاً واضحاً يقابله نص مشفر ويحاول استنتاج المفتاح، يكون الهجوم:', options: { A: 'نص مشفر فقط', B: 'نص واضح معروف', C: 'نص واضح مختار', D: 'نص مشفر مختار' }, answer: 'B' },
        { num: 36, type: 'mcq', text: 'لرفع مقاومة هجوم القوة الغاشمة ينبغي أن يكون:', options: { A: 'المفتاح طويلاً جداً بصرف النظر عن الفضاء', B: 'فضاء المفاتيح المحتملة كبيراً', C: 'تنفيذ الخوارزمية معقداً فقط', D: 'المفتاح مستخدماً مرة واحدة دائماً' }, answer: 'B' },
        { num: 37, type: 'mcq', text: 'عند استخدام الشيفرة الضربية بالمفتاح K=7 لتشفير HELLO، يكون الناتج:', options: { A: 'XCZZU', B: 'XCZUZ', C: 'XCUUZ', D: 'XUCCZ' }, answer: 'A', explanation: 'H(7)=7×7=49≡23=X, E(4)=4×7=28≡2=C, L(11)=11×7=77≡25=Z, L=Z, O(14)=14×7=98≡20=U → XCZZU' },
        { num: 38, type: 'mcq', text: 'عند استخدام الشيفرة التألفية بالمفتاح K=(7,2) لتشفير HELLO، يكون الناتج:', options: { A: 'ZEWWB', B: 'BEWWZ', C: 'WEBBZ', D: 'ZEBBW' }, answer: 'D', explanation: 'C=(7P+2) mod26: H→Z، E→E→Z? لا: H(7)→(49+2)mod26=51mod26=25=Z، E(4)→(28+2)=30mod26=4=E → ZEBBW' },
        { num: 39, type: 'mcq', text: 'حجم فضاء المفاتيح في الشيفرة التألفية على الأبجدية الإنكليزية هو:', options: { A: '325', B: '26', C: '312', D: '338' }, answer: 'C', explanation: '12 مفتاحاً ضربياً صالحاً × 26 إزاحة = 312' },
        { num: 40, type: 'mcq', text: 'عند استخدام Autokey بالمفتاح الابتدائي K=12 لتشفير ATTACK، يكون الناتج:', options: { A: 'MCCMTK', B: 'TMMTMC', C: 'MTMTCM', D: 'TMTMCM' }, answer: 'C' },
        { num: 41, type: 'mcq', text: 'عند استخدام Playfair بالمفتاح COMPUTER لتشفير ATTACK، يكون الناتج وفق نموذج الدورة:', options: { A: 'EBBETV', B: 'BEEBTV', C: 'BEEBVT', D: 'EBBEVT' }, answer: 'B' },
        { num: 42, type: 'mcq', text: 'إخفاء العلاقة بين النص المشفر والمفتاح يسمى:', options: { A: 'الانتشار', B: 'الهامش الأمني', C: 'التفريق', D: 'التشويش (Confusion)' }, answer: 'D' },
        { num: 43, type: 'mcq', text: 'في S-DES يكون حجم الكتلة N وطول المفتاح K:', options: { A: 'N=10, K=10', B: 'N=8, K=8', C: 'N=8, K=10', D: 'N=10, K=8' }, answer: 'C' },
        { num: 44, type: 'mcq', text: 'في DES يكون حجم الكتلة N وطول المفتاح الفعّال K:', options: { A: 'N=56, K=48', B: 'N=64, K=48', C: 'N=128, K=64', D: 'N=64, K=56' }, answer: 'D' },
        { num: 45, type: 'mcq', text: 'التأثير الانهياري يعني تغيراً كبيراً في النص المشفر عند تغير صغير في:', options: { A: 'النص الأصلي فقط', B: 'النص الأصلي أو المفتاح', C: 'المفتاح فقط', D: 'طول المفتاح فقط' }, answer: 'B' },
        { num: 46, type: 'mcq', text: 'في AES، إذا كان عدد الدورات 12 فالحجم الصحيح للكتلة والمفتاح هو:', options: { A: 'N=128, K=192', B: 'N=128, K=128', C: 'N=192, K=192', D: 'N=256, K=256' }, answer: 'A' },
        { num: 47, type: 'mcq', text: 'عند استخدام التشفير غير المتماثل لحماية بيانات موجهة إلى مستقبل، يقع عبء حماية المفتاح الخاص أساساً على:', options: { A: 'المرسل', B: 'مركز توزيع المفاتيح', C: 'المستقبل', D: 'مزود التوقيع' }, answer: 'C' },
        { num: 48, type: 'mcq', text: 'أفضل خيار ضمن خيارات الدورة لتبادل المفاتيح مع ضمان عدم الإنكار هو:', options: { A: 'المنحنيات الإهليلجية', B: 'مركز توثيق/جهة تصديق', C: 'Diffie-Hellman وحده', D: 'مركز توزيع مفاتيح متماثلة' }, answer: 'B' },
        { num: 49, type: 'mcq', text: 'خوارزمية متماثلة كتلية، فيستل 16 دورة، مفتاح 32 إلى 448 بت، واستُخدمت في نواة Linux:', options: { A: 'DES', B: 'Blowfish', C: 'Twofish', D: 'IDEA' }, answer: 'B' },
        { num: 50, type: 'mcq', text: 'كل العبارات التالية عن التوقيع الرقمي صحيحة ما عدا:', options: { A: 'يساعد في منع الإنكار', B: 'يحقق سرية الرسالة بذاته', C: 'لا يُنجز عادةً بتشفير متماثل فقط', D: 'يساعد في وثوقية الرسالة' }, answer: 'B', explanation: 'التوقيع الرقمي يحقق المصادقة وعدم الإنكار، لكنه لا يحقق السرية بذاته.' },
        { num: 51, type: 'mcq', text: 'عند استخدام RSA في التوقيع الرقمي تُستخدم مفاتيح:', options: { A: 'خاص المرسل وعام المستقبل', B: 'خاص وعام المستقبل', C: 'خاص وعام المرسل', D: 'خاص المستقبل وعام المرسل' }, answer: 'C' },
        { num: 52, type: 'mcq', text: 'في الإخفاء (Steganography) كل العبارات التالية صحيحة ما عدا:', options: { A: 'من الخطوات تحويل النص إلى ثنائي', B: 'لا يمكن تشفير البيانات قبل إخفائها', C: 'LSB من أهم خوارزميات الإخفاء', D: 'قد يكون الحامل صورة أو صوتاً أو فيديو' }, answer: 'B', explanation: 'يمكن تشفير البيانات قبل إخفائها لزيادة الأمان.' },
        { num: 53, type: 'mcq', text: 'وفق مفتاح الدورة، الخوارزمية غير الكتلية بين الخيارات الآتية هي:', options: { A: 'RSA', B: 'RC4', C: 'RC6', D: 'Blowfish' }, answer: 'B', note: 'صياغة التصنيف قابلة للنقاش؛ أُبقي جواب المصدر.' },
        { num: 54, type: 'mcq', text: 'الخوارزمية الأكثر مقاومة لهجوم القوة الغاشمة ضمن الخيارات هي:', options: { A: 'DES', B: 'AES', C: 'LSB', D: 'RSA' }, answer: 'B' },
        { num: 55, type: 'mcq', text: 'في Diffie-Hellman إذا p=5 و g=2 و x=2 و y=3 فإن المفتاح المشترك يساوي:', options: { A: '1', B: '2', C: '3', D: '4' }, answer: 'D', explanation: 'R1=2²mod5=4، R2=2³mod5=3، K=3²mod5=9mod5=4' },
    ];

    // ============================================================
    //  بناء البيانات
    // ============================================================

    const SECTIONS = [
        { id: 'review', label: '📖 مراجعة المحاضرة الأولى', description: 'أهم الأسئلة مع الإجابات النموذجية للمراجعة', isReview: true },
        { id: 'lecture1', label: '🧪 اختبار المحاضرة الأولى', description: 'البرمجة التفرعية – النظري (تصنيفات Flynn)', isLecture: true },
        { id: 'course-2025', label: 'دورة 2025 الثانية', description: 'أسئلة الدورة التدريبية الثانية 2025', isLecture: false },
        { id: 'course-2026', label: 'دورة 2026 الأولى', description: 'أسئلة دورة 2026 الأولى (نفس محتوى 2025)', isLecture: false },
    ];

    function makeSectionData(sectionId, tfArr, mcqArr) {
        return [
            ...tfArr.map(q => ({ ...q, type: 'tf', section: sectionId })),
            ...mcqArr.map(q => ({ ...q, type: 'mcq', section: sectionId })),
        ];
    }

    const ALL_QUESTIONS = [
        ...makeSectionData('lecture1', LECTURE_TF, LECTURE_MCQ),
        ...makeSectionData('course-2025', COURSE_TF, COURSE_MCQ),
        ...makeSectionData('course-2026', COURSE_TF, COURSE_MCQ),
    ];

    // ============================================================
    //  التطبيق
    // ============================================================

    let currentSection = 'review';
    let isQuizMode = false;
    let quizSubmitted = false;
    let userAnswers = {};

    function getQuestionsForSection(sectionId) {
        if (sectionId === 'review') {
            return REVIEW_QUESTIONS.map(q => ({ ...q, type: 'review', section: 'review' }));
        }
        return ALL_QUESTIONS.filter(q => q.section === sectionId);
    }

    function renderTabs() {
        const container = document.getElementById('sectionTabs');
        container.innerHTML = SECTIONS.map(s => {
            let extraClass = '';
            let badge = '';
            if (s.isReview) {
                extraClass = 'review-tab';
                badge = '<span class="badge-review">📝 مراجعة</span>';
            } else if (s.isLecture) {
                extraClass = 'lecture-tab';
                badge = '<span class="badge-lecture">⭐ أساسي</span>';
            }
            return `<button class="${s.id === currentSection ? 'active' : ''} ${extraClass}" data-id="${s.id}">
                ${s.label}
                ${badge}
            </button>`;
        }).join('');
        container.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isQuizMode && !confirm('الخروج من وضع الاختبار سيفقد إجاباتك الحالية. هل تريد المتابعة؟')) return;
                currentSection = btn.dataset.id;
                isQuizMode = false;
                quizSubmitted = false;
                userAnswers = {};
                renderTabs();
                renderStats();
                renderQuestions();
                renderTestActions();
            });
        });
    }

    function renderStats() {
        const section = SECTIONS.find(s => s.id === currentSection);
        const questions = getQuestionsForSection(currentSection);
        const statsEl = document.getElementById('statsBar');

        let resultHtml = '';
        if (quizSubmitted && currentSection !== 'review') {
            const results = calculateResults();
            resultHtml = `<span class="result-banner">📊 النتيجة: ${results.correct} / ${results.total} (${results.percentage}%)</span>`;
        }

        let statsInfo = '';
        if (currentSection === 'review') {
            statsInfo = `<span>📌 <strong>${section.label}</strong> — ${section.description}</span>
                         <span>📝 عدد الأسئلة: <span class="num">${questions.length}</span></span>
                         <span style="color:#1f7a5a;">✅ الإجابات النموذجية متضمنة</span>`;
        } else {
            const tf = questions.filter(q => q.type === 'tf');
            const mcq = questions.filter(q => q.type === 'mcq');
            statsInfo = `<span>📌 <strong>${section.label}</strong> — ${section.description}</span>
                         <span>صح/خطأ: <span class="num">${tf.length}</span></span>
                         <span>اختيار من متعدد: <span class="num">${mcq.length}</span></span>
                         <span>المجموع: <span class="num">${questions.length}</span></span>`;
        }

        statsEl.innerHTML = `
            ${statsInfo}
            ${!isQuizMode && currentSection !== 'review' ? `<button class="test-btn" id="startQuizBtn">🧪 اختبر نفسك</button>` : ''}
            ${!isQuizMode && currentSection === 'review' ? `<button class="test-btn review-btn" id="printReviewBtn">📄 طباعة المراجعة</button>` : ''}
            ${resultHtml}
        `;

        const startBtn = document.getElementById('startQuizBtn');
        if (startBtn) {
            startBtn.addEventListener('click', () => {
                if (isQuizMode) return;
                isQuizMode = true;
                quizSubmitted = false;
                userAnswers = {};
                renderStats();
                renderQuestions();
                renderTestActions();
            });
        }

        const printBtn = document.getElementById('printReviewBtn');
        if (printBtn) {
            printBtn.addEventListener('click', () => {
                window.print();
            });
        }
    }

    function renderTestActions() {
        const container = document.getElementById('testActions');
        if (currentSection === 'review' || !isQuizMode) {
            container.innerHTML = '';
            return;
        }

        const endBtnHtml = `<button class="test-btn active-test" id="endQuizBtn">📝 إنهاء الاختبار</button>`;
        container.innerHTML = endBtnHtml;

        const endBtn = document.getElementById('endQuizBtn');
        if (endBtn) {
            endBtn.addEventListener('click', () => {
                if (!isQuizMode) return;
                if (quizSubmitted) {
                    if (!confirm('تم احتساب النتيجة بالفعل. هل تريد إعادة الاختبار؟')) return;
                    quizSubmitted = false;
                    userAnswers = {};
                    renderStats();
                    renderQuestions();
                    renderTestActions();
                    return;
                }
                quizSubmitted = true;
                renderStats();
                renderQuestions();
                renderTestActions();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    }

    function calculateResults() {
        const questions = getQuestionsForSection(currentSection);
        let correct = 0;
        let total = 0;
        questions.forEach(q => {
            const key = `${q.section}-${q.num}`;
            const userAns = userAnswers[key];
            if (userAns !== undefined && userAns !== null && userAns !== '') {
                total++;
                if (q.type === 'tf') {
                    if (userAns === q.answer.toString()) correct++;
                } else if (q.type === 'mcq') {
                    if (userAns === q.answer) correct++;
                }
            }
        });
        const percentage = total > 0 ? Math.round((correct / total) * 100) : 0;
        return { correct, total, percentage };
    }

    function renderQuestions() {
        const questions = getQuestionsForSection(currentSection);
        const container = document.getElementById('questionList');
        if (!questions.length) {
            container.innerHTML = '<p style="padding:2rem;">لا توجد أسئلة لهذا القسم</p>';
            return;
        }

        // قسم المراجعة
        if (currentSection === 'review') {
            container.innerHTML = questions.map(q => {
                return `
                    <div class="question-card review-card">
                        <div class="q-header">
                            <span class="q-num">${q.icon || '📌'} سؤال ${q.num}</span>
                            <span class="q-type review-type">سؤال وجواب</span>
                            <span class="q-topic review-topic">📌 ${q.topic}</span>
                        </div>
                        <div class="q-text">${q.text}</div>
                        <div class="answer-box">
                            <strong>✏️ الإجابة النموذجية:</strong><br>
                            ${q.answer}
                        </div>
                    </div>
                `;
            }).join('');
            return;
        }

        // قسم الاختبارات
        container.innerHTML = questions.map((q, idx) => {
            const key = `${q.section}-${q.num}`;
            const userVal = userAnswers[key] || '';

            let optionsHtml = '';
            let answerDisplay = '';
            let explanationHtml = '';
            let cardClass = '';

            if (quizSubmitted) {
                const isCorrect = (() => {
                    if (q.type === 'tf') return userVal === q.answer.toString();
                    if (q.type === 'mcq') return userVal === q.answer;
                    return false;
                })();
                cardClass = isCorrect ? 'correct' : 'wrong';
                const isUnanswered = userVal === '' || userVal === undefined;
                if (isUnanswered) cardClass = 'wrong';
            }

            const topicBadge = q.topic ? `<span class="q-topic">📌 ${q.topic}</span>` : '';

            if (q.type === 'tf') {
                const checkedTrue = userVal === 'true' ? 'checked' : '';
                const checkedFalse = userVal === 'false' ? 'checked' : '';
                const disabled = quizSubmitted ? 'disabled' : '';
                optionsHtml = `
                    <div class="tf-options">
                        <label><input type="radio" name="tf-${key}" value="true" ${checkedTrue} ${disabled} onchange="handleAnswer('${key}', 'true')"> ✅ صحيح</label>
                        <label><input type="radio" name="tf-${key}" value="false" ${checkedFalse} ${disabled} onchange="handleAnswer('${key}', 'false')"> ❌ خطأ</label>
                    </div>
                `;
                if (quizSubmitted) {
                    const isCorrect = userVal === q.answer.toString();
                    answerDisplay = `<span class="tf-answer">${isCorrect ? '✅' : '❌'} ${q.answer ? 'صحيح' : 'خطأ'}</span>`;
                } else {
                    answerDisplay = `<span class="tf-answer">${userVal ? (userVal === 'true' ? 'صحيح' : 'خطأ') : 'لم تُجب'}</span>`;
                }
            } else if (q.type === 'mcq') {
                const opts = q.options;
                const letters = ['A', 'B', 'C', 'D'];
                const disabled = quizSubmitted ? 'disabled' : '';
                optionsHtml = `<div class="options">${letters.map(l => `
                    <label><input type="radio" name="mcq-${key}" value="${l}" ${userVal === l ? 'checked' : ''} ${disabled} onchange="handleAnswer('${key}', '${l}')"> <strong>${l}.</strong> ${opts[l] || ''}</label>
                `).join('')}</div>`;
                if (quizSubmitted) {
                    const isCorrect = userVal === q.answer;
                    answerDisplay = `<span class="mcq-answer">${isCorrect ? '✅' : '❌'} الإجابة: ${q.answer || '(غير محددة)'}</span>`;
                } else {
                    answerDisplay = `<span class="mcq-answer">${userVal ? `المختار: ${userVal}` : 'لم تُجب'}</span>`;
                }
                if (q.note) answerDisplay += ` <span style="font-size:0.8rem;color:#3b6e8f;">${q.note}</span>`;
            }

            if (q.explanation && quizSubmitted) {
                explanationHtml = `<div class="explanation"><strong>📘 شرح:</strong> ${q.explanation}</div>`;
            }

            const modeClass = isQuizMode ? 'quiz-mode' : '';

            return `
                <div class="question-card ${cardClass} ${modeClass}">
                    <div class="q-header">
                        <span class="q-num">سؤال ${q.num}</span>
                        <span class="q-type">${q.type === 'tf' ? 'صح/خطأ' : 'اختيار من متعدد'}</span>
                        ${topicBadge}
                        ${answerDisplay}
                    </div>
                    <div class="q-text">${q.text}</div>
                    ${optionsHtml}
                    ${explanationHtml}
                </div>
            `;
        }).join('');

        window.handleAnswer = function(key, value) {
            if (isQuizMode && !quizSubmitted) {
                userAnswers[key] = value;
                renderQuestions();
                renderStats();
            }
        };
    }

    window.handleAnswer = function(key, value) {
        if (isQuizMode && !quizSubmitted) {
            userAnswers[key] = value;
            renderQuestions();
            renderStats();
        }
    };

    function init() {
        renderTabs();
        renderStats();
        renderQuestions();
        renderTestActions();
    }

    init();
</script>
</body>
</html>
