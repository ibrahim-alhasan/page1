<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>البرمجة التفرعية – الدراسة والاختبار</title>
    <style>
      :root {
        --primary: #1a5e7e;
        --primary-light: #2a7fa8;
        --primary-soft: #e3eef7;
        --accent: #1f7a5a;
        --accent-soft: #e8f5f0;
        --warn: #b13e3e;
        --warn-soft: #fdf6f6;
        --gold: #c88a1a;
        --gold-soft: #fff8e7;
        --text: #1e2b3c;
        --text-muted: #436f8b;
        --border: #dce8f2;
        --bg: #f0f6fb;
        --card: #ffffff;
        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-sm: 10px;
        --shadow: 0 4px 20px rgba(0, 20, 40, 0.06);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", "Tahoma", "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 1rem;
        line-height: 1.7;
      }
      .page {
        max-width: 900px;
        margin: 0 auto;
      }

      .hero {
        background: linear-gradient(
          135deg,
          #0b3b4f 0%,
          #1a6b8f 60%,
          #1f7a5a 100%
        );
        border-radius: 28px;
        padding: 2rem 2.5rem;
        color: white;
        margin-bottom: 1.5rem;
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        top: -40px;
        left: -40px;
        width: 200px;
        height: 200px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 50%;
      }
      .hero::after {
        content: "";
        position: absolute;
        bottom: -60px;
        right: -20px;
        width: 250px;
        height: 250px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 50%;
      }
      .hero h1 {
        font-size: 1.8rem;
        font-weight: 800;
        margin-bottom: 0.3rem;
      }
      .hero p {
        font-size: 0.95rem;
        opacity: 0.85;
      }
      .hero-badges {
        display: flex;
        gap: 0.6rem;
        margin-top: 1rem;
        flex-wrap: wrap;
      }
      .hero-badge {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 0.25rem 0.9rem;
        border-radius: 30px;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .lecture-nav {
        display: flex;
        gap: 0.4rem;
        overflow-x: auto;
        padding-bottom: 0.5rem;
        margin-bottom: 1.5rem;
        scrollbar-width: none;
      }
      .lecture-nav::-webkit-scrollbar {
        display: none;
      }
      .lec-tab {
        flex-shrink: 0;
        background: var(--card);
        border: 1.5px solid var(--border);
        padding: 0.5rem 1.1rem;
        border-radius: 40px;
        font-weight: 600;
        font-size: 0.82rem;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .lec-tab:hover {
        background: var(--primary-soft);
        border-color: var(--primary-light);
        color: var(--primary);
      }
      .lec-tab.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
        box-shadow: 0 4px 14px rgba(26, 94, 126, 0.3);
      }

      .lecture-panel {
        display: none;
      }
      .lecture-panel.active {
        display: block;
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .lec-header {
        background: var(--card);
        border-radius: var(--radius-lg);
        padding: 1.4rem 1.8rem;
        margin-bottom: 1.2rem;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .lec-header h2 {
        font-size: 1.3rem;
        color: var(--primary);
        border-right: 5px solid var(--primary);
        padding-right: 0.8rem;
        margin-bottom: 0.3rem;
      }
      .lec-header p {
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      .mode-switcher {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 1.5rem;
      }
      .mode-btn {
        flex: 1;
        padding: 0.7rem 1rem;
        border-radius: 50px;
        border: 2px solid var(--border);
        background: var(--card);
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s;
        color: var(--text-muted);
        text-align: center;
      }
      .mode-btn.active.review {
        background: var(--gold-soft);
        border-color: var(--gold);
        color: #7a4d0a;
      }
      .mode-btn.active.quiz {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: #0b4e33;
      }

      .review-section {
        display: none;
      }
      .review-section.active {
        display: block;
      }
      .review-card {
        background: var(--card);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        border-right: 5px solid var(--gold);
        padding: 1.3rem 1.6rem;
        margin-bottom: 1rem;
        box-shadow: var(--shadow);
        transition: all 0.2s;
      }
      .review-card:hover {
        border-right-color: #e6a817;
        box-shadow: 0 6px 24px rgba(0, 20, 40, 0.09);
      }
      .review-q-header {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.6rem;
      }
      .review-icon {
        font-size: 1.3rem;
      }
      .review-num {
        background: var(--gold-soft);
        color: var(--gold);
        border: 1.5px solid #e6c97a;
        padding: 0.1rem 0.7rem;
        border-radius: 20px;
        font-weight: 700;
        font-size: 0.78rem;
      }
      .review-topic {
        background: var(--primary-soft);
        color: var(--primary);
        padding: 0.1rem 0.7rem;
        border-radius: 20px;
        font-weight: 600;
        font-size: 0.75rem;
      }
      .review-q {
        font-size: 1rem;
        font-weight: 700;
        color: #0b3b4f;
        margin-bottom: 0.8rem;
        line-height: 1.7;
      }
      .reveal-btn {
        background: transparent;
        border: 1.5px solid var(--gold);
        color: var(--gold);
        padding: 0.35rem 1.2rem;
        border-radius: 30px;
        font-weight: 700;
        font-size: 0.82rem;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .reveal-btn:hover {
        background: var(--gold-soft);
      }
      .reveal-btn.revealed {
        border-color: var(--accent);
        color: var(--accent);
      }
      .answer-box {
        display: none;
        background: var(--accent-soft);
        border-right: 4px solid var(--accent);
        border-radius: var(--radius-md);
        padding: 0.9rem 1.2rem;
        margin-top: 0.7rem;
        color: #0b3b2e;
        font-size: 0.93rem;
        animation: fadeIn 0.3s ease;
        line-height: 1.8;
      }
      .answer-box.show {
        display: block;
      }
      .answer-box strong {
        color: #064d30;
      }
      .answer-box ul {
        padding-right: 1.4rem;
        margin: 0.3rem 0;
      }
      .answer-box li {
        margin-bottom: 0.25rem;
      }
      .answer-box .code-block {
        background: #e0f0e8;
        border-radius: 8px;
        padding: 0.5rem 0.9rem;
        font-family: "Courier New", monospace;
        font-size: 0.85rem;
        margin-top: 0.5rem;
        direction: ltr;
        text-align: left;
      }

      .quiz-section {
        display: none;
      }
      .quiz-section.active {
        display: block;
      }
      .quiz-stats {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        background: var(--card);
        padding: 0.9rem 1.5rem;
        border-radius: 50px;
        border: 1px solid var(--border);
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        box-shadow: var(--shadow);
      }
      .quiz-stats span {
        font-weight: 500;
        font-size: 0.88rem;
        color: var(--text-muted);
      }
      .quiz-stats .num {
        background: var(--primary-soft);
        color: var(--primary);
        padding: 0.1rem 0.8rem;
        border-radius: 20px;
        font-weight: 700;
        font-size: 0.88rem;
      }
      .quiz-btn {
        margin-right: auto;
        background: var(--accent);
        color: white;
        border: none;
        padding: 0.45rem 1.6rem;
        border-radius: 40px;
        font-weight: 700;
        font-size: 0.88rem;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 3px 10px rgba(31, 122, 90, 0.25);
      }
      .quiz-btn:hover {
        background: #136348;
        transform: scale(0.97);
      }
      .quiz-btn.stop {
        background: var(--warn);
        box-shadow: 0 3px 10px rgba(177, 62, 62, 0.3);
      }
      .quiz-btn.stop:hover {
        background: #8f2f2f;
      }
      .result-banner {
        background: var(--accent-soft);
        border-right: 5px solid var(--accent);
        border-radius: 50px;
        padding: 0.35rem 1.5rem;
        font-weight: 700;
        font-size: 0.95rem;
        color: #0f5132;
        animation: fadeIn 0.4s ease;
      }
      .result-banner.fail {
        background: var(--warn-soft);
        border-right-color: var(--warn);
        color: #7a1f1f;
      }

      .q-grid {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      .q-card {
        background: var(--card);
        border-radius: var(--radius-lg);
        padding: 1.2rem 1.5rem;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        transition: all 0.15s;
      }
      .q-card:hover {
        border-color: #b6d2e9;
      }
      .quiz-mode .q-card {
        border-right: 5px solid var(--primary-light);
      }
      .quiz-mode .q-card.correct {
        border-right-color: var(--accent);
        background: #f6fcf9;
      }
      .quiz-mode .q-card.wrong {
        border-right-color: var(--warn);
        background: var(--warn-soft);
      }
      .q-head {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.5rem;
        flex-wrap: wrap;
      }
      .q-num {
        font-weight: 700;
        color: var(--primary);
        font-size: 0.88rem;
      }
      .q-badge {
        padding: 0.1rem 0.8rem;
        border-radius: 20px;
        font-size: 0.72rem;
        font-weight: 700;
      }
      .badge-tf {
        background: #dce8f5;
        color: #1a4a6b;
      }
      .badge-mcq {
        background: #e0f0e8;
        color: #0b4e33;
      }
      .q-text {
        font-size: 0.97rem;
        font-weight: 600;
        line-height: 1.7;
        margin-bottom: 0.8rem;
        color: #0d2a3e;
      }
      .exam-question-intro {
        line-height: 1.9;
      }
      .exam-code {
        direction: ltr;
        text-align: left;
        white-space: pre-wrap;
        background: #f1f7f4;
        border: 1px solid #c6dfd2;
        border-left: 4px solid var(--accent);
        border-radius: 10px;
        padding: 0.9rem 1.1rem;
        margin: 0.9rem 0;
        color: #173b32;
        font-family: "Courier New", monospace;
        font-size: 0.92rem;
        font-weight: 700;
        line-height: 1.8;
        overflow-x: auto;
      }
      .exam-question-label {
        display: block;
        margin-top: 0.7rem;
        color: var(--primary);
        font-weight: 800;
      }
      .source-question {
        background: linear-gradient(135deg, #fbfdff 0%, #f1f8f5 100%);
        border: 1px solid #c9dfe0;
        border-radius: 14px;
        padding: 0.9rem 1rem;
        margin-top: 0.35rem;
      }
      .source-question .source-intro {
        color: #25495b;
        font-size: 0.92rem;
        line-height: 1.9;
        margin-bottom: 0.5rem;
      }
      .source-question .exam-code {
        margin: 0.7rem 0;
        background: #fff;
        border-left-color: var(--primary);
        font-size: 0.84rem;
        line-height: 1.65;
      }
      .source-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.45rem 0.7rem;
        direction: ltr;
        margin-top: 0.7rem;
      }
      .source-option {
        display: block;
        padding: 0.48rem 0.65rem;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid #d5e2e5;
        border-radius: 8px;
        color: #203d4b;
        font-family: "Courier New", monospace;
        font-size: 0.78rem;
        line-height: 1.45;
        text-align: left;
        direction: ltr;
      }
      .source-option strong {
        color: var(--primary);
        margin-right: 0.25rem;
      }
      .matrix-pair {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 1.2rem;
        direction: ltr;
        margin: 0.8rem 0;
        flex-wrap: wrap;
      }
      .matrix-label {
        display: block;
        color: var(--primary);
        font-family: "Segoe UI", Tahoma, sans-serif;
        font-size: 0.78rem;
        font-weight: 800;
        text-align: center;
        margin-bottom: 0.25rem;
      }
      .matrix {
        display: grid;
        grid-template-columns: repeat(5, minmax(2rem, 2.7rem));
        border: 1px solid #b9d1d6;
        border-radius: 7px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 2px 7px rgba(20, 70, 80, 0.08);
      }
      .matrix span {
        padding: 0.22rem 0.25rem;
        border-right: 1px solid #d7e5e7;
        border-bottom: 1px solid #d7e5e7;
        color: #234353;
        font-family: "Courier New", monospace;
        font-size: 0.76rem;
        font-weight: 700;
        text-align: center;
        line-height: 1.25;
      }
      .matrix span:nth-child(5n) {
        border-right: 0;
      }
      .matrix span:nth-last-child(-n + 5) {
        border-bottom: 0;
      }
      .matrix-result .matrix span {
        background: #f0f8f4;
        color: #0b5940;
      }
      .matrix-option {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        min-height: 9.8rem;
        padding: 0.55rem;
        direction: ltr;
      }
      .matrix-option > strong {
        flex: 0 0 auto;
        padding-top: 0.15rem;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      .matrix-option .matrix {
        grid-template-columns: repeat(5, minmax(1.4rem, 1.9rem));
        flex: 1;
      }
      .matrix-option .matrix span {
        padding: 0.16rem 0.1rem;
        font-size: 0.62rem;
      }
      .matrix-option-text {
        color: #234353;
        font-family: "Segoe UI", Tahoma, sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 1.5;
      }
      @media (max-width: 600px) {
        .source-options {
          grid-template-columns: 1fr;
        }
        .source-option {
          font-size: 0.74rem;
        }
        .matrix-pair {
          gap: 0.7rem;
        }
        .matrix {
          grid-template-columns: repeat(5, minmax(1.8rem, 2.3rem));
        }
      }
      .tf-opts {
        display: flex;
        gap: 2rem;
        background: #f3f8fe;
        padding: 0.6rem 1.5rem;
        border-radius: 50px;
        width: fit-content;
        flex-wrap: wrap;
      }
      .tf-opts label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.95rem;
        padding: 0.25rem 0.6rem;
        border-radius: 10px;
        transition: background 0.15s;
      }
      .tf-opts label:hover {
        background: #e3eef9;
      }
      .tf-opts input[type="radio"] {
        width: 1.2rem;
        height: 1.2rem;
        accent-color: var(--primary);
        cursor: pointer;
      }
      .mcq-opts {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .mcq-opts label {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        font-weight: 500;
        font-size: 0.93rem;
        cursor: pointer;
        padding: 0.4rem 0.8rem;
        border-radius: var(--radius-sm);
        background: #f3f8fe;
        transition: background 0.15s;
      }
      .mcq-opts label:hover {
        background: #e3eef9;
      }
      .mcq-opts input[type="radio"] {
        width: 1.1rem;
        height: 1.1rem;
        accent-color: var(--primary);
        cursor: pointer;
        flex-shrink: 0;
      }
      .q-explanation {
        background: #eef4fa;
        border-right: 4px solid #578baa;
        border-radius: var(--radius-md);
        padding: 0.6rem 1.1rem;
        margin-top: 0.7rem;
        font-size: 0.88rem;
        color: #1d4057;
        animation: fadeIn 0.3s ease;
        display: none;
      }
      .q-explanation.show {
        display: block;
      }
      .q-correct-tag {
        display: inline-block;
        padding: 0.1rem 0.7rem;
        border-radius: 15px;
        font-size: 0.78rem;
        font-weight: 700;
        margin-bottom: 0.3rem;
      }
      .tag-correct {
        background: #c8ebd9;
        color: #0b4e30;
      }
      .tag-wrong {
        background: #f5d3d3;
        color: #7a1f1f;
      }

      .quiz-footer {
        display: flex;
        justify-content: center;
        padding: 1.5rem 0 2rem;
        border-top: 1px solid var(--border);
      }
      .quiz-footer .quiz-btn {
        font-size: 1.1rem;
        padding: 0.8rem 3rem;
        max-width: 350px;
        width: 100%;
      }

      .page-footer {
        text-align: center;
        padding: 1.5rem;
        color: var(--text-muted);
        font-size: 0.82rem;
        border-top: 1px solid var(--border);
        margin-top: 2rem;
      }

      @media (max-width: 640px) {
        body {
          padding: 0.7rem;
        }
        .hero {
          padding: 1.5rem 1.2rem;
          border-radius: 20px;
        }
        .hero h1 {
          font-size: 1.4rem;
        }
        .lec-tab {
          font-size: 0.75rem;
          padding: 0.45rem 0.8rem;
        }
        .lec-header {
          padding: 1rem 1.1rem;
        }
        .lec-header h2 {
          font-size: 1.1rem;
        }
        .mode-btn {
          font-size: 0.82rem;
          padding: 0.6rem 0.6rem;
        }
        .review-card {
          padding: 1rem 1.1rem;
        }
        .q-card {
          padding: 1rem 1.1rem;
        }
        .tf-opts {
          padding: 0.5rem 1rem;
          gap: 1.5rem;
        }
        .quiz-footer .quiz-btn {
          font-size: 1rem;
          padding: 0.7rem 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hero">
        <h1>📘 البرمجة التفرعية – النظري</h1>
        <p>مراجعة شاملة لجميع المحاضرات مع اختبارات تقييم ذاتي</p>
        <div class="hero-badges">
          <span class="hero-badge">🎓 10 محاضرات</span>
          <span class="hero-badge">💡 مراجعة سؤال وجواب</span>
          <span class="hero-badge">✅ صح/خطأ</span>
          <span class="hero-badge">📝 اختيار من متعدد</span>
        </div>
      </div>

      <div class="lecture-nav" id="lectureNav"></div>
      <div id="lectureContent"></div>

      <div class="page-footer">
        ✔️ في وضع الاختبار، اختر إجاباتك ثم اضغط "إنهاء الاختبار" لعرض نتيجتك
        والتصحيح
      </div>
    </div>

    <script>
      // ================================================================
      //  بيانات المحاضرات
      // ================================================================
      const LECTURES = [
        {
          id: "l1",
          title: "المحاضرة 1",
          subtitle: "مقدمة في البرمجة التفرعية",
          desc: "تصنيفات Flynn، الفرق بين التوازي والتوزع، الخيط والعملية، الجدولة",
          review: [
            {
              num: 1,
              icon: "🎯",
              topic: "مفاهيم أساسية",
              q: "ما هي البرمجة التفرعية وما هدفها الأساسي؟",
              a: "البرمجة التفرعية هي تطبيق برمجي يُنفَّذ على عدة معالجات أو أنوية في نفس الوقت. <strong>هدفها الأساسي</strong>: تحسين الأداء وتقليل وقت التنفيذ مقارنةً بالتنفيذ التسلسلي على معالج واحد.",
            },
            {
              num: 2,
              icon: "🔄",

          } else {
            correctStr =
              String.fromCharCode(65 + q.answer) + ". " + q.opts[q.answer];
            isCorrect = selected && parseInt(selected.value) === q.answer;
          }
          if (isCorrect) {
            correct++;
            card.classList.add("correct");
          } else {
            card.classList.add("wrong");
          }
          expEl.innerHTML = `<span class="q-correct-tag ${isCorrect ? "tag-correct" : "tag-wrong"}">${isCorrect ? "✓ صحيح" : "✗ خطأ"}</span> الإجابة الصحيحة: <strong>${correctStr}</strong>${q.exp ? " — " + q.exp : ""}`;
          expEl.classList.add("show");
          document
            .querySelectorAll(`input[name="q-${lecId}-${i}"]`)
            .forEach((r) => (r.disabled = true));
        });
        const total = lec.quiz.length;
        const pct = Math.round((correct / total) * 100);
        const resultEl = document.getElementById(`result-${lecId}`);
        const emoji = pct >= 80 ? "🏆" : pct >= 60 ? "👍" : "💪";
        const msg =
          pct >= 80
            ? "ممتاز! أداء رائع"
            : pct >= 60
              ? "جيد! راجع الأسئلة الخاطئة"
              : "تحتاج مراجعة أكثر";
        const bannerClass = pct < 60 ? "result-banner fail" : "result-banner";
        resultEl.innerHTML = `<div class="${bannerClass}" style="margin-bottom:1rem">
        ${emoji} نتيجتك: ${correct} / ${total} (${pct}%) — ${msg}
    </div>`;
        const footer = document.getElementById(`qfooter-${lecId}`);
        footer.textContent = "🔄 إعادة الاختبار";
        footer.className = "quiz-btn";
        footer.onclick = () => startQuiz(lecId);
      }

      // ================================================================
      //  التشغيل
      // ================================================================
      renderNav();
      renderLectures();
    </script>
  </body>
</html>
