<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>اختبارات إلكترونية – أمن المعلومات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', 'Helvetica Neue', sans-serif;
            background: #f4f8fc;
            color: #1e2b3c;
            padding: 1rem;
            line-height: 1.6;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            border-right: 6px solid #1e6f9f;
            padding-right: 1rem;
            margin-bottom: 0.25rem;
            color: #0b3b4f;
            letter-spacing: -0.5px;
        }

        .subhead {
            color: #2c5770;
            margin-bottom: 1.5rem;
            font-weight: 300;
            border-bottom: 1px solid #cbdae6;
            padding-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .section-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: #e9f0f7;
            padding: 0.8rem;
            border-radius: 50px;
            justify-content: center;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.03);
        }

        .section-tabs button {
            background: transparent;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #1f4057;
            cursor: pointer;
            transition: 0.2s;
            background: #ffffffb0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            flex: 1 0 auto;
            max-width: 180px;
            white-space: nowrap;
        }

        .section-tabs button:hover {
            background: #c7dcec;
            transform: scale(0.97);
        }

        .section-tabs button.active {
            background: #1a5e7e;
            color: white;
            box-shadow: 0 4px 12px rgba(22, 78, 109, 0.25);
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1.5rem;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 40px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            justify-content: center;
            align-items: center;
            border: 1px solid #e3edf5;
            transition: all 0.3s ease;
        }

        .stats span {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .stats .num {
            background: #dce8f2;
            padding: 0.1rem 0.9rem;
            border-radius: 30px;
            font-weight: 700;
            color: #10415c;
        }

        .test-btn {
            background: #1f7a5a;
            color: white;
            border: none;
            padding: 0.5rem 1.8rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(26, 107, 74, 0.2);
            margin-right: auto;
        }

        .test-btn:hover {
            background: #136348;
            transform: scale(0.97);
        }

        .test-btn.active-test {
            background: #b13e3e;
            box-shadow: 0 4px 12px rgba(176, 52, 52, 0.3);
        }

        .test-btn.active-test:hover {
            background: #8f2f2f;
        }

        .result-banner {
            background: #e2f0e9;
            border-radius: 60px;
            padding: 0.3rem 1.5rem;
            font-weight: 700;
            font-size: 1rem;
            color: #0f5132;
            border-right: 6px solid #1f7a5a;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .question-card {
            background: white;
            border-radius: 24px;
            padding: 1.2rem 1.5rem;
            box-shadow: 0 4px 16px rgba(0, 20, 30, 0.04);
            border: 1px solid #e3edf5;
            transition: 0.15s;
        }

        .question-card:hover {
            border-color: #b6d2e9;
        }

        .q-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
            gap: 0.3rem;
        }

        .q-type {
            background: #d4e2ed;
            padding: 0.15rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            color: #1b4055;
            letter-spacing: 0.3px;
        }

        .q-num {
            font-weight: 600;
            color: #1d577a;
        }

        .q-text {
            font-size: 1rem;
            margin: 0.4rem 0 0.8rem 0;
            line-height: 1.7;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 0.8rem 1rem;
            background: #f3f8fe;
            border-radius: 20px;
            margin-top: 0.2rem;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.3rem 0.5rem;
            border-radius: 12px;
            transition: background 0.15s;
        }

        .options label:hover {
            background: #e3eef9;
        }

        .options input[type="radio"] {
            width: 1.2rem;
            height: 1.2rem;
            accent-color: #1a6b8f;
            cursor: pointer;
            flex-shrink: 0;
        }

        .tf-options {
            display: flex;
            gap: 2.5rem;
            background: #f3f8fe;
            padding: 0.6rem 2rem;
            border-radius: 60px;
            width: fit-content;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tf-options label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            transition: background 0.15s;
        }

        .tf-options label:hover {
            background: #e3eef9;
        }

        .tf-options input[type="radio"] {
            width: 1.3rem;
            height: 1.3rem;
            accent-color: #1a6b8f;
            cursor: pointer;
            flex-shrink: 0;
        }

        .explanation {
            background: #eef4fa;
            border-radius: 16px;
            padding: 0.5rem 1.2rem;
            margin-top: 0.8rem;
            color: #1d4057;
            font-size: 0.9rem;
            border-right: 4px solid #578baa;
            animation: fadeIn 0.4s ease;
        }

        .explanation strong {
            color: #05445e;
        }

        .mcq-answer {
            background: #d9e7f3;
            border-radius: 16px;
            padding: 0.1rem 0.8rem;
            font-weight: 600;
            color: #003153;
            font-size: 0.8rem;
        }

        .tf-answer {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .quiz-mode .question-card {
            border-right: 6px solid #1a6b8f;
        }

        .quiz-mode .question-card.correct {
            border-right-color: #1f7a5a;
            background: #f6fcf9;
        }

        .quiz-mode .question-card.wrong {
            border-right-color: #b13e3e;
            background: #fdf6f6;
        }

        .test-actions {
            display: flex;
            justify-content: center;
            padding: 1.5rem 0 2rem 0;
            border-top: 1px solid #cddde9;
            margin-top: 0.5rem;
        }

        .test-actions .test-btn {
            font-size: 1.2rem;
            padding: 0.8rem 3rem;
            margin-right: 0;
            width: 100%;
            max-width: 350px;
            text-align: center;
            border-radius: 60px;
            box-shadow: 0 6px 18px rgba(26, 107, 74, 0.25);
        }

        .test-actions .test-btn.active-test {
            background: #b13e3e;
            box-shadow: 0 6px 18px rgba(176, 52, 52, 0.3);
        }

        .test-actions .test-btn.active-test:hover {
            background: #8f2f2f;
        }

        .footnote {
            margin-top: 1rem;
            padding: 0.8rem;
            text-align: center;
            color: #436f8b;
            border-top: 1px solid #cddde9;
            font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            body {
                padding: 0.8rem;
            }

            h1 {
                font-size: 1.5rem;
                padding-right: 0.8rem;
            }

            .section-tabs {
                padding: 0.6rem;
                gap: 0.4rem;
                border-radius: 30px;
            }

            .section-tabs button {
                font-size: 0.75rem;
                padding: 0.4rem 0.8rem;
                max-width: 140px;
                flex: 1 1 auto;
                white-space: normal;
            }

            .stats {
                padding: 0.8rem 1rem;
                gap: 0.6rem;
                border-radius: 30px;
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .stats span {
                font-size: 0.85rem;
            }

            .test-btn {
                font-size: 0.9rem;
                padding: 0.4rem 1.2rem;
                margin-right: 0;
                width: 100%;
                text-align: center;
            }

            .result-banner {
                font-size: 0.9rem;
                padding: 0.2rem 1rem;
                text-align: center;
            }

            .question-card {
                padding: 1rem;
                border-radius: 18px;
            }

            .q-text {
                font-size: 0.95rem;
            }

            .options {
                padding: 0.6rem 0.8rem;
                gap: 0.5rem;
            }

            .options label {
                font-size: 0.88rem;
                padding: 0.2rem 0.4rem;
            }

            .tf-options {
                padding: 0.5rem 1.2rem;
                gap: 1.8rem;
                width: 100%;
                justify-content: center;
            }

            .tf-options label {
                font-size: 0.95rem;
                padding: 0.2rem 0.5rem;
            }

            .tf-options input[type="radio"] {
                width: 1.2rem;
                height: 1.2rem;
            }

            .test-actions .test-btn {
                font-size: 1rem;
                padding: 0.7rem 1.5rem;
                max-width: 100%;
            }

            .explanation {
                font-size: 0.85rem;
                padding: 0.4rem 1rem;
            }
        }

        @media (max-width: 400px) {
            .section-tabs button {
                font-size: 0.7rem;
                padding: 0.3rem 0.6rem;
                max-width: 120px;
            }

            .stats {
                padding: 0.6rem 0.8rem;
            }

            .question-card {
                padding: 0.8rem;
            }

            .q-text {
                font-size: 0.9rem;
            }

            .options label {
                font-size: 0.82rem;
            }

            .tf-options {
                gap: 1.2rem;
                padding: 0.4rem 0.8rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📘 اختبارات أمن المعلومات</h1>
    <div class="subhead">اختر النموذج أو الدورة — اضغط "اختبر نفسك" للإجابة ثم اعرض النتيجة</div>

    <div id="sectionTabs" class="section-tabs"></div>

    <div id="questionList" class="question-grid"></div>

</div>

<script>

        { id: 'model-c', label: 'النموذج الشامل C', description: 'النموذج الثالث – فخاخ واستثناءات وربط بين المحاضرات', tfCount: 25, mcqCount: 30 },

        { num: 3, type: 'tf', text: 'السياسة الأمنية في الشركة هي فقط مجموعة تدابير لمنع خرق الأنظمة المعلوماتية.', answer: false, explanation: 'السياسة الأمنية تشمل الوقاية والتعامل مع الخرق بعد وقوعه.' },
        { num: 4, type: 'tf', text: 'يُعد الخداع والإنكار من أكبر المهددات لسرية المعلومات.', answer: false, explanation: 'الخداع والإنكار من مهددات التكاملية، وليس السرية.' },
        { num: 5, type: 'tf', text: 'يُعد تحليل حركة الاتصالات من أكبر المهددات لسلامة البيانات وتكاملها.', answer: false, explanation: 'تحليل حركة الاتصالات يهدد السرية، وليس التكاملية.' },
        { num: 6, type: 'tf', text: 'التشفير هو عملية مزج البيانات والمعلومات بصورة عشوائية.', answer: false, explanation: 'التشفير عملية منظمة وفق خوارزمية ومفتاح، وليس مزجاً عشوائياً.' },
        { num: 7, type: 'tf', text: 'يشمل الأمن المادي حماية البنى التحتية والعتاد والأفراد والمبنى والحد من أثر الهندسة الاجتماعية.', answer: true },
        { num: 8, type: 'tf', text: 'ارتفاع درجات الحرارة من المهددات البيئية للأمن المادي لنظم المعلومات.', answer: true },
        { num: 9, type: 'tf', text: 'للمحافظة على استمرارية العمل ينبغي توفير تجهيزات ومراكز بيانات بديلة.', answer: true },
        { num: 10, type: 'tf', text: 'تُعد شيفرات تبديل المواقع شديدة المقاومة للهجوم الإحصائي.', answer: false, explanation: 'شيفرات تبديل المواقع تحافظ على تكرارات الحروف فهي ضعيفة أمام الهجوم الإحصائي.' },
        { num: 11, type: 'tf', text: 'تعتمد خوارزميات التشفير المتماثل على حسابات رياضية معقدة لتوليد مفاتيح التشفير.', answer: false, explanation: 'هذا وصف التشفير غير المتماثل (RSA)؛ أما المتماثل فيعتمد على المفتاح المشترك السري.' },

        { num: 13, type: 'tf', text: 'تُستخدم عملية توسعة المفتاح لزيادة طول المفتاح عند الحاجة.', answer: false, explanation: 'توسعة المفتاح تولّد مفاتيح فرعية من المفتاح الأصلي، ولا تزيد طوله مباشرة.' },
        { num: 14, type: 'tf', text: 'تنجح الهندسة الاجتماعية لأنها تستهدف الجانب النفسي لدى الضحية.', answer: true },
        { num: 15, type: 'tf', text: 'تعتمد مقاومة خوارزمية التشفير للهجوم أساساً على سرية وتعقيد الخوارزمية نفسها.', answer: false, explanation: 'وفق مبدأ كيركهوفس، تعتمد المقاومة على سرية المفتاح لا على سرية الخوارزمية.' },

        { num: 17, type: 'tf', text: 'خوارزمية DES خوارزمية تشفير كتلي متماثل.', answer: true },

        { num: 26, type: 'mcq', text: 'يُعرَّف أمن المعلومات بأنه:', options: { A: 'حماية المعلومات المتداولة من العبث والتخريب والتبديل', B: 'إجراءات لحماية المعلومات الداخلية والخارجية', C: 'استراتيجيات لتجنب الثغرات الأمنية', D: 'جميع ما سبق' }, answer: 'D' },

        { num: 22, type: 'tf', text: 'تطبق RC4 الاستبدالات والتبديلات مباشرة على بايتات النص الأصلي.', answer: false, explanation: 'دورها توليد تيار المفتاح؛ النص يدمج معه بـ XOR.' },
        { num: 23, type: 'tf', text: 'احتلت Serpent المرتبة الثانية بعد Rijndael في نهائي مسابقة AES.', answer: true },
        { num: 24, type: 'tf', text: 'التشفير غير المتماثل هو الخيار الأفضل عادة لتشفير ملفات ضخمة كاملة مباشرة.', answer: false, explanation: 'يستخدم للقطع الصغيرة مثل المفاتيح؛ والمتماثل للبيانات الكبيرة.' },
        { num: 25, type: 'tf', text: 'يساعد الختم الزمني على الحد من إعادة إرسال رسالة موقعة سابقاً.', answer: true },
    ];
    const MODEL_C_MCQ = [
        { num: 26, type: 'mcq', text: 'أي مجموعة تمثل مكونات نظام المعلومات كاملة؟', options: { A: 'عتاد وبرمجيات فقط', B: 'عتاد، برمجيات، مستخدمون، إجراءات، بيانات', C: 'بيانات ومفاتيح فقط', D: 'شبكة ومبنى فقط' }, answer: 'B' },
        { num: 27, type: 'mcq', text: 'العناصر الضرورية لشن الهجوم الإلكتروني هي:', options: { A: 'الدافع فقط', B: 'الثغرة فقط', C: 'الدافع والطريقة والثغرة', D: 'التشفير والتوقيع' }, answer: 'C' },
        { num: 28, type: 'mcq', text: 'أي هجوم يهدد الإتاحة مباشرة؟', options: { A: 'Traffic Analysis', B: 'Snooping', C: 'Denial of Service', D: 'Substitution' }, answer: 'C' },
        { num: 29, type: 'mcq', text: 'أي إجراء يعد من التحكم الفيزيائي بالوصول؟', options: { A: 'كاميرات وبطاقات دخول', B: 'تشفير قيصر', C: 'تجزئة الرسالة', D: 'توسيع AES' }, answer: 'A' },
        { num: 30, type: 'mcq', text: 'أضعف حلقة في منظومة الحماية غالباً هي:', options: { A: 'العنصر البشري', B: 'المصفوفة', C: 'عملية XOR', D: 'الكتلة' }, answer: 'A' },
        { num: 31, type: 'mcq', text: 'وفق مبدأ كيركهوفس، العنصر الذي يجب إبقاؤه سرياً هو:', options: { A: 'اسم الخوارزمية', B: 'المفتاح', C: 'حجم الملف', D: 'نوع الحاسوب' }, answer: 'B' },
        { num: 32, type: 'mcq', text: 'العلاقة الصحيحة في المشفر الجمعي هي:', options: { A: 'C=(P+K) mod26', B: 'C=P×P', C: 'P=C+K mod2 فقط', D: 'C=K/P' }, answer: 'A' },
        { num: 33, type: 'mcq', text: 'أي مفتاح غير صالح للشيفرة الضربية على Z26؟', options: { A: '5', B: '7', C: '11', D: '13' }, answer: 'D', explanation: '13 ليس أولياً نسبياً مع 26 (gcd(13,26)=13≠1).' },
        { num: 34, type: 'mcq', text: 'وفق نموذج الدورة، تشفير ATTACK بمشفر Autokey والمفتاح الابتدائي K=12 يعطي:', options: { A: 'MTMTCM', B: 'ATTACK', C: 'ZEBBW', D: 'XCZZU' }, answer: 'A' },
        { num: 35, type: 'mcq', text: 'في Playfair يمكن أن يشفر الحرف نفسه إلى:', options: { A: 'رمز واحد دائماً', B: 'واحد من خمسة أحرف محتملة وفق موقع الزوج', C: 'كل الأبجدية بلا قيد', D: 'رقم فقط' }, answer: 'B' },
        { num: 36, type: 'mcq', text: 'أي شرط أساسي يمنح One-Time Pad أمانه؟', options: { A: 'مفتاح ثابت قصير', B: 'مفتاح عشوائي بطول الرسالة يستخدم مرة واحدة', C: 'مفتاح عام منشور', D: 'كتلة 64 بت دائماً' }, answer: 'B' },
        { num: 37, type: 'mcq', text: 'أي عبارة تميز شيفرة الكتلة عن شيفرة التيار؟', options: { A: 'الكتلة تعالج مجموعة رموز معاً', B: 'التيار لا يستخدم مفتاحاً', C: 'الكتلة لا تنتج نصاً مشفراً', D: 'التيار غير متماثل' }, answer: 'A' },
        { num: 38, type: 'mcq', text: 'كم بت حشو تحتاج رسالة من 100 محرف بترميز 8 بت مع كتلة 64 بت؟', options: { A: '0', B: '16', C: '32', D: '64' }, answer: 'C', explanation: '100×8=800 بت، 800mod64=32، فنضيف 32 بت للوصول إلى 832.' },
        { num: 39, type: 'mcq', text: 'صندوق P-box 3×5 هو:', options: { A: 'توسيعاً', B: 'ضغطاً', C: 'مباشراً', D: 'S-box' }, answer: 'B', explanation: 'm>n: 5 خرج < 3 دخل؟ P-box 3×5 يعني 3 دخل و5 خرج = توسيع... لا: notation 3×5 = 3 input, 5 output = توسيع؟ الجواب B=ضغطاً وفق مفتاح الإجابة (m>n=compression)' },
        { num: 40, type: 'mcq', text: 'في فك تشفير شبكة فيستل ذات مفتاحي K1 وK2، الترتيب هو:', options: { A: 'K1 ثم K2', B: 'K2 ثم K1', C: 'K1 فقط', D: 'لا تستخدم مفاتيح' }, answer: 'B' },
        { num: 41, type: 'mcq', text: 'عدد دورات S-DES هو:', options: { A: '2', B: '8', C: '10', D: '16' }, answer: 'A' },
        { num: 42, type: 'mcq', text: 'عدد صناديق S-box داخل تابع DES هو:', options: { A: '2', B: '4', C: '8', D: '16' }, answer: 'C' },
        { num: 43, type: 'mcq', text: 'أي عبارة صحيحة عن AES؟', options: { A: 'الكتلة تتغير مع طول المفتاح', B: 'الكتلة 128 بت دائماً', C: 'كل المفاتيح 56 بت', D: 'هي تشفير تسلسلي' }, answer: 'B' },
        { num: 44, type: 'mcq', text: 'في AES-128، يولد Key Expansion عدد مفاتيح فرعية يساوي:', options: { A: '2', B: '10', C: '11', D: '16' }, answer: 'C', explanation: 'Nr=10 ولذلك يولد Nr+1=11 مفتاحاً فرعياً' },
        { num: 45, type: 'mcq', text: 'الاختصار KSA في RC4 يعني:', options: { A: 'Key Scheduling Algorithm', B: 'Key Signature Authority', C: 'Known Stream Attack', D: 'Kernel Security AES' }, answer: 'A' },
        { num: 46, type: 'mcq', text: 'استُخدمت عائلة A5/x تاريخياً في:', options: { A: 'تشفير مكالمات GSM', B: 'توقيع PDF فقط', C: 'شيفرة قيصر', D: 'ضغط الصور' }, answer: 'A' },
        { num: 47, type: 'mcq', text: 'أي خوارزمية كتلية تستخدم أربعة مسجالت A,B,C,D و20 دورة؟', options: { A: 'RC6', B: 'RC4', C: 'RSA', D: 'LSB' }, answer: 'A' },
        { num: 48, type: 'mcq', text: 'أي خوارزمية من مرشحي AES تستخدم كتلة 128 بت و32 دورة؟', options: { A: 'Serpent', B: 'Blowfish', C: 'IDEA', D: 'Rabin' }, answer: 'A' },
        { num: 49, type: 'mcq', text: 'في شبكة تضم n مستخدمين، التشفير غير المتماثل يحتاج تقريباً إلى:', options: { A: 'n عملية أمنية/زوج مفاتيح لكل مستخدم', B: 'n(n-1)/2 مفاتيح خاصة مشتركة', C: 'مفتاح واحد للجميع بلا خاص', D: 'لا مفاتيح' }, answer: 'A' },
        { num: 50, type: 'mcq', text: 'أي سلسلة تعد Superincreasing؟', options: { A: '[1,2,3,4]', B: '[2,3,6,12]', C: '[5,5,5,5]', D: '[4,3,2,1]' }, answer: 'B', explanation: 'كل عنصر أكبر من مجموع ما قبله: 3>2، 6>5، 12>11' },
        { num: 51, type: 'mcq', text: 'عند توليد مفاتيح RSA يجب اختيار e بحيث:', options: { A: 'gcd(e,φ(n))=1', B: 'e=φ(n)', C: 'e=0', D: 'e=pq دائماً' }, answer: 'A' },
        { num: 52, type: 'mcq', text: 'الميزة الأساسية لـ Diffie-Hellman هي:', options: { A: 'إنتاج مفتاح سري مشترك عبر قناة عامة دون KDC', B: 'تشفير الملفات مباشرة بلا مفتاح', C: 'منع MITM تلقائياً', D: 'إنشاء توقيع رقمي وحده' }, answer: 'A' },
        { num: 53, type: 'mcq', text: 'تتضمن الشهادة الرقمية عادة:', options: { A: 'المفتاح العام وهوية صاحبه ومدة الصلاحية وتوقيع جهة الإصدار', B: 'المفتاح الخاص منشوراً', C: 'كلمة مرور المستخدم', D: 'النص الواضح فقط' }, answer: 'A' },
        { num: 54, type: 'mcq', text: 'أي عبارة صحيحة في التوقيع الرقمي بـ RSA؟', options: { A: 'S=M^d mod n ويُتحقق بالمفتاح العام', B: 'S=M^e ويُتحقق بالخاص للمستقبل', C: 'لا تستخدم مفاتيح', D: 'يحقق السرية وحدها' }, answer: 'A' },
        { num: 55, type: 'mcq', text: 'ما الفارق الأدق بين التشفير والإخفاء؟', options: { A: 'التشفير يخفي المعنى، والإخفاء يخفي وجود الرسالة', B: 'كلاهما الشيء نفسه', C: 'الإخفاء لا يستخدم ملفات', D: 'التشفير لا يستخدم مفاتيح' }, answer: 'A' },
    ];

    // -------- بناء البيانات الكاملة ----------
    function makeSectionData(sectionId, tfArr, mcqArr) {
        return [
            ...tfArr.map(q => ({ ...q, section: sectionId })),
            ...mcqArr.map(q => ({ ...q, section: sectionId })),
        ];
    }

    const ALL_QUESTIONS = [
        ...makeSectionData('course-2025', COURSE_TF, COURSE_MCQ),
        ...makeSectionData('course-2026', COURSE_TF, COURSE_MCQ),
        ...makeSectionData('model-a', MODEL_A_TF, MODEL_A_MCQ),
        ...makeSectionData('model-b', MODEL_B_TF, MODEL_B_MCQ),
        ...makeSectionData('model-c', MODEL_C_TF, MODEL_C_MCQ),
    ];

    // ====== التطبيق ======
    let currentSection = 'course-2025';
    let isQuizMode = false;
    let quizSubmitted = false;
    let userAnswers = {};

    function getQuestionsForSection(sectionId) {
        return ALL_QUESTIONS.filter(q => q.section === sectionId);
    }

    function renderTabs() {
        const container = document.getElementById('sectionTabs');
        container.innerHTML = SECTIONS.map(s =>
            `<button class="${s.id === currentSection ? 'active' : ''}" data-id="${s.id}">
                ${s.label}
            </button>`
        ).join('');
        container.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isQuizMode && !confirm('الخروج من وضع الاختبار سيفقد إجاباتك الحالية. هل تريد المتابعة؟')) return;
                currentSection = btn.dataset.id;
                isQuizMode = false;
                quizSubmitted = false;
                userAnswers = {};
                renderTabs();
                renderStats();
                renderQuestions();
                renderTestActions();
            });
        });
    }

    function renderStats() {
        const section = SECTIONS.find(s => s.id === currentSection);
        const questions = getQuestionsForSection(currentSection);
        const tf = questions.filter(q => q.type === 'tf');
        const mcq = questions.filter(q => q.type === 'mcq');
        const statsEl = document.getElementById('statsBar');

        let resultHtml = '';
        if (quizSubmitted) {
            const results = calculateResults();
            resultHtml = `<span class="result-banner">📊 النتيجة: ${results.correct} / ${results.total} (${results.percentage}%)</span>`;
        }

        statsEl.innerHTML = `
            <span>📌 <strong>${section.label}</strong> — ${section.description}</span>
            <span>صح/خطأ: <span class="num">${tf.length}</span></span>
            <span>اختيار من متعدد: <span class="num">${mcq.length}</span></span>
            <span>المجموع: <span class="num">${questions.length}</span></span>
            ${!isQuizMode ? `<button class="test-btn" id="startQuizBtn">🧪 اختبر نفسك</button>` : ''}
            ${resultHtml}
        `;

        const startBtn = document.getElementById('startQuizBtn');
        if (startBtn) {
            startBtn.addEventListener('click', () => {
                if (isQuizMode) return;
                isQuizMode = true;
                quizSubmitted = false;
                userAnswers = {};
                renderStats();
                renderQuestions();
                renderTestActions();
            });
        }
    }

    function renderTestActions() {
        const container = document.getElementById('testActions');
        if (!isQuizMode) {
            container.innerHTML = '';
            return;
        }

        const endBtnHtml = `<button class="test-btn active-test" id="endQuizBtn">📝 إنهاء الاختبار</button>`;
        container.innerHTML = endBtnHtml;

        const endBtn = document.getElementById('endQuizBtn');
        if (endBtn) {
            endBtn.addEventListener('click', () => {
                if (!isQuizMode) return;
                if (quizSubmitted) {
                    if (!confirm('تم احتساب النتيجة بالفعل. هل تريد إعادة الاختبار؟')) return;
                    quizSubmitted = false;
                    userAnswers = {};
                    renderStats();
                    renderQuestions();
                    renderTestActions();
                    return;
                }
                quizSubmitted = true;
                renderStats();
                renderQuestions();
                renderTestActions();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    }

    function calculateResults() {
        const questions = getQuestionsForSection(currentSection);
        let correct = 0;
        let total = 0;
        questions.forEach(q => {
            const key = `${q.section}-${q.num}`;
            const userAns = userAnswers[key];
            if (userAns !== undefined && userAns !== null && userAns !== '') {
                total++;
                if (q.type === 'tf') {
                    if (userAns === q.answer.toString()) correct++;
                } else if (q.type === 'mcq') {
                    if (userAns === q.answer) correct++;
                }
            }
        });
        const percentage = total > 0 ? Math.round((correct / total) * 100) : 0;
        return { correct, total, percentage };
    }

    function renderQuestions() {
        const questions = getQuestionsForSection(currentSection);
        const container = document.getElementById('questionList');
        if (!questions.length) {
            container.innerHTML = '<p style="padding:2rem;">لا توجد أسئلة لهذا القسم</p>';
            return;
        }

        container.innerHTML = questions.map((q, idx) => {
            const key = `${q.section}-${q.num}`;
            const userVal = userAnswers[key] || '';

            let optionsHtml = '';
            let answerDisplay = '';
            let explanationHtml = '';
            let cardClass = '';

            if (quizSubmitted) {
                const isCorrect = (() => {
                    if (q.type === 'tf') return userVal === q.answer.toString();
                    if (q.type === 'mcq') return userVal === q.answer;
                    return false;
                })();
                cardClass = isCorrect ? 'correct' : 'wrong';
                const isUnanswered = userVal === '' || userVal === undefined;
                if (isUnanswered) cardClass = 'wrong';
            }

            if (q.type === 'tf') {
                const checkedTrue = userVal === 'true' ? 'checked' : '';
                const checkedFalse = userVal === 'false' ? 'checked' : '';
                const disabled = quizSubmitted ? 'disabled' : '';
                optionsHtml = `
                    <div class="tf-options">
                        <label><input type="radio" name="tf-${key}" value="true" ${checkedTrue} ${disabled} onchange="handleAnswer('${key}', 'true')"> صحيح</label>
                        <label><input type="radio" name="tf-${key}" value="false" ${checkedFalse} ${disabled} onchange="handleAnswer('${key}', 'false')"> خطأ</label>
                    </div>
                `;
                if (quizSubmitted) {
                    const isCorrect = userVal === q.answer.toString();
                    answerDisplay = `<span class="tf-answer">${isCorrect ? '✅' : '❌'} ${q.answer ? 'صحيح' : 'خطأ'}</span>`;
                } else {
                    answerDisplay = `<span class="tf-answer">${userVal ? (userVal === 'true' ? 'صحيح' : 'خطأ') : 'لم تُجب'}</span>`;
                }
            } else if (q.type === 'mcq') {
                const opts = q.options;
                const letters = ['A', 'B', 'C', 'D'];
                const disabled = quizSubmitted ? 'disabled' : '';
                optionsHtml = `<div class="options">${letters.map(l => `
                    <label><input type="radio" name="mcq-${key}" value="${l}" ${userVal === l ? 'checked' : ''} ${disabled} onchange="handleAnswer('${key}', '${l}')"> ${l}. ${opts[l] || ''}</label>
                `).join('')}</div>`;
                if (quizSubmitted) {
                    const isCorrect = userVal === q.answer;
                    answerDisplay = `<span class="mcq-answer">${isCorrect ? '✅' : '❌'} الإجابة: ${q.answer || '(غير محددة)'}</span>`;
                } else {
                    answerDisplay = `<span class="mcq-answer">${userVal ? `المختار: ${userVal}` : 'لم تُجب'}</span>`;
                }
                if (q.note) answerDisplay += ` <span style="font-size:0.8rem;color:#3b6e8f;">${q.note}</span>`;
            }

            if (q.explanation && quizSubmitted) {
                explanationHtml = `<div class="explanation"><strong>📘 شرح:</strong> ${q.explanation}</div>`;
            }

            const modeClass = isQuizMode ? 'quiz-mode' : '';

            return `
                <div class="question-card ${cardClass} ${modeClass}">
                    <div class="q-header">
                        <span class="q-num">سؤال ${q.num}</span>
                        <span class="q-type">${q.type === 'tf' ? 'صح/خطأ' : 'اختيار من متعدد'}</span>
                        ${answerDisplay}
                    </div>
                    <div class="q-text">${q.text}</div>
                    ${optionsHtml}
                    ${explanationHtml}
                </div>
            `;
        }).join('');

        window.handleAnswer = function(key, value) {
            if (isQuizMode && !quizSubmitted) {
                userAnswers[key] = value;
                renderQuestions();
                renderStats();
            }
        };
    }

    window.handleAnswer = function(key, value) {
        if (isQuizMode && !quizSubmitted) {
            userAnswers[key] = value;
            renderQuestions();
            renderStats();
        }
    };

    function init() {
        renderTabs();
        renderStats();
        renderQuestions();
        renderTestActions();
    }

    init();
</script>
</body>
